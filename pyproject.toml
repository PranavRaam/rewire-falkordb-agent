[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rewire"
version = "0.1.0"
description = "Graph-directed workflow recovery with an inspectable control room"
requires-python = ">=3.10"
dependencies = ["FalkorDB==1.8.0", "mcp==2.1.1", "fastapi==0.143.3", "uvicorn==0.54.0"]

[project.scripts]
rewire = "rewire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
